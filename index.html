<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物質の移動ラボ｜人体の構造 インタラクティブ教材</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* --- [ブロック：CSS変数・基本リセット] ここから --- */
    :root {
      --bg-base: #f2f6fa;
      --bg-surface: rgba(255, 255, 255, 0.86);
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-subtle: rgba(15, 23, 42, 0.08);
      --accent-water: #0ea5e9;
      --accent-water-soft: rgba(14, 165, 233, 0.14);
      --accent-solute: #f97316;
      --accent-solute-soft: rgba(249, 115, 22, 0.14);
      --accent-membrane: #0f766e;
      --accent-membrane-soft: rgba(15, 118, 110, 0.12);
      --accent-atp: #eab308;
      --accent-atp-soft: rgba(234, 179, 8, 0.18);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-pill: 9999px;
      --shadow-soft: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
      --shadow-float: 0 18px 38px -12px rgba(14, 165, 233, 0.18);
      --transition-smooth: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Kaku Gothic New', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 12% 8%, rgba(14, 165, 233, 0.12), transparent 42%),
                  radial-gradient(circle at 88% 18%, rgba(15, 118, 110, 0.1), transparent 40%),
                  var(--bg-base);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
      padding-bottom: 64px;
      -webkit-font-smoothing: antialiased;
    }
    /* --- [ブロック：CSS変数・基本リセット] ここまで --- */

    /* --- [ブロック：ヘッダー・レイアウトCSS] ここから --- */
    .app-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-emblem {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0ea5e9, #0f766e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-emblem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .header-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--accent-membrane-soft);
      color: var(--accent-membrane);
      border: 1px solid rgba(15, 118, 110, 0.2);
    }
    /* --- [ブロック：ヘッダー・レイアウトCSS] ここまで --- */

    /* --- [ブロック：移動ルート・イオン概要バーCSS] ここから --- */
    .overview-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .mini-info-card {
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-soft);
    }

    .mini-info-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-membrane);
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .route-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .route-node {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .route-arrow {
      color: var(--accent-water);
      font-weight: 800;
    }

    .ion-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.84rem;
    }

    .ion-tag {
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 700;
    }

    .ion-ext {
      background: var(--accent-water-soft);
      color: #0369a1;
    }

    .ion-int {
      background: var(--accent-solute-soft);
      color: #c2410c;
    }
    /* --- [ブロック：移動ルート・イオン概要バーCSS] ここまで --- */

    /* --- [ブロック：タブ切替・シミュレーターCSS] ここから --- */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      cursor: pointer;
      text-align: left;
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth), background var(--transition-smooth);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-float);
      border-color: rgba(14, 165, 233, 0.4);
    }

    .tab-btn.is-active {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.35);
    }

    .tab-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent-water);
    }

    .tab-name {
      font-size: 1.02rem;
      font-weight: 700;
    }

    .tab-meta {
      font-size: 0.74rem;
      color: var(--text-sub);
    }

    .tab-btn.is-active .tab-meta {
      color: #cbd5e1;
    }

    .lab-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      align-items: start;
      margin-bottom: 24px;
    }

    .canvas-card, .explain-card, .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }

    .canvas-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .canvas-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .energy-chip {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
    }

    .energy-passive {
      background: var(--accent-water-soft);
      color: #0369a1;
    }

    .energy-active {
      background: var(--accent-atp-soft);
      color: #a16207;
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(180deg, #f8fafc 0%, #eef5fb 100%);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    #simCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .ctrl-btn:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .ctrl-btn.primary {
      background: var(--accent-water);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 14px rgba(14, 165, 233, 0.28);
    }

    .ctrl-btn.primary:hover {
      background: #0284c7;
    }

    .ctrl-btn.action-special {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.3);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-left: auto;
    }
    /* --- [ブロック：タブ切替・シミュレーターCSS] ここまで --- */

    /* --- [ブロック：解説・クイズ・通知・レスポンシブCSS] ここから --- */
    .explain-heading {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .explain-text {
      font-size: 0.92rem;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .point-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .point-list li {
      font-size: 0.86rem;
      padding: 10px 12px;
      background: #f8fafc;
      border-left: 3px solid var(--accent-water);
      border-radius: 0 8px 8px 0;
    }

    .stat-meter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 0.82rem;
    }

    .stat-value {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-membrane);
    }

    .quiz-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .quiz-question {
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .quiz-opt-btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: #f8fafc;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .quiz-opt-btn:hover {
      border-color: var(--accent-water);
      background: #ffffff;
    }

    .quiz-opt-btn.is-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }

    .quiz-opt-btn.is-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }

    .quiz-feedback {
      font-size: 0.88rem;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      display: none;
      margin-bottom: 10px;
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
    }

    .toast-box.is-show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .mode-tabs {
        grid-template-columns: repeat(2, 1fr);
      }
      .lab-grid {
        grid-template-columns: 1fr;
      }
      .slider-wrap {
        margin-left: 0;
        width: 100%;
      }
    }
    /* --- [ブロック：解説・クイズ・通知・レスポンシブCSS] ここまで --- */

    /* === [新規機能追加エリア：CSS] 新しいCSSブロックはこの真上に貼り付け === */
  </style>
</head>
